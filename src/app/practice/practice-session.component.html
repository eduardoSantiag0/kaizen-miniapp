@switch (screen()) {
  @case ('loading') {
    <kz-paper-background />
    <div class="kz-session-state" role="status" aria-label="Loading your practice session">Loading…</div>
  }
  @case ('error') {
    <kz-paper-background />
    <div class="kz-session-state">
      <p class="kz-session-state-title">Couldn't load your practice session</p>
      <p class="kz-session-state-body">Check your connection and try again. Your progress is saved.</p>
      <button type="button" class="kz-session-retry" (click)="retry()">Try again</button>
    </div>
  }
  @case ('ready') {
    @if (isGeneratedSession()) {
      <button type="button" class="kz-session-back" aria-label="Back to Daily Practice" (click)="back()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M11 4l-5 5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Daily Practice
      </button>
    }
    @if (currentExercise()) {
      <kz-exercise-page
        mode="daily"
        [gameId]="currentExercise()!.gameId"
        [phase]="currentExercise()!.phase"
        [depth]="currentExercise()!.currentDepth"
        [topVariants]="currentExercise()!.topVariants"
        [progress]="currentProgress()"
        [sessionLabel]="sessionLabel()"
        [isLastExercise]="isLastExercise()"
        (exerciseSolved)="onExerciseSolved()"
        (progressChanged)="onProgressChanged($event)"
        (dailyNext)="onDailyNext()"
      />
    }
  }
}
