<kz-paper-background />

<div class="kz-exercise-page">
  <kz-exercise-context
    [turnText]="turnText()"
    [turnSign]="turnSign()"
    [metaText]="metaText()"
    [step]="state().step"
    [totalSteps]="state().totalSteps"
    [showProgress]="state().screen === 'ready'"
  />

  @let exerciseLine = line();
  @if (exerciseLine && state().screen === 'ready') {
    <kz-goban-view [state]="state()" [line]="exerciseLine" (vertexTap)="onVertexTap($event)" />

    <kz-kaizen-message
      [title]="message().title"
      [body]="message().body"
      [tone]="message().tone"
      [emphasized]="message().emphasized"
      [celebrate]="celebrate()"
    />

    <!-- Kept mounted (not @if'd away) so hiding it on 'done' can fade/collapse
         smoothly instead of cutting instantly — see kz-tools--hidden. -->
    <kz-exercise-tools
      [class.kz-tools--hidden]="!showTools()"
      [attr.aria-hidden]="!showTools()"
      [hintOn]="state().hintOn"
      [zoomedIn]="state().zoomedIn"
      [zoomDisabled]="zoomDisabled()"
      [undoDisabled]="!canUndoState()"
      [showHint]="mode() === 'menu'"
      [showUndo]="mode() === 'menu'"
      (hintToggle)="onHintToggle()"
      (reset)="onReset()"
      (zoomToggle)="onZoomToggle()"
      (undo)="onUndo()"
    />
  } @else {
    <kz-kaizen-message
      [title]="message().title"
      [body]="message().body"
      [tone]="message().tone"
      [emphasized]="message().emphasized"
    />
  }

  <!-- Daily mode hands the 'correct' kind off to LineCompleteActions (Try
       another line / Go deeper / Next exercise — handoff section 6) instead
       of ExerciseActions' plain Play again/Back to games pair; every other
       kind (tryAgain, loading, error screens) is shared by both modes. -->
  @if (mode() === 'daily' && actions().kind === 'correct') {
    <kz-line-complete-actions
      [isLastExercise]="isLastExercise()"
      [goDeeperEnabled]="canGoDeeper()"
      (tryAnotherLine)="onReset()"
      (goDeeper)="onGoDeeper()"
      (next)="onDailyNext()"
    />
  } @else {
    <kz-exercise-actions
      [actions]="actions()"
      [correctSecondaryLabel]="correctSecondaryLabel()"
      (tryAgain)="onUndo()"
      (playAgain)="onReset()"
      (backToGames)="backToGames()"
      (doneSecondary)="onDoneSecondary()"
      (retryLoad)="onRetryLoad()"
    />
  }

  <kz-seigaiha-fill />
</div>
