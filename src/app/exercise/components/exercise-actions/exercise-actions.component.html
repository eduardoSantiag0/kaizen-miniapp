<div class="kz-actions" [class.kz-actions--stacked]="actions().kind === 'correct'">
  @switch (actions().kind) {
    @case ('tryAgain') {
      <button type="button" class="kz-btn kz-btn--primary" (click)="tryAgain.emit()">Try again</button>
    }
    @case ('correct') {
      <!-- Primary action first, secondary second — matches the stated hierarchy
           (1. visual confirmation, 2. message, 3. primary action, 4. secondary). -->
      <button
        type="button"
        class="kz-btn kz-btn--primary kz-btn--full kz-btn--enter"
        (click)="doneSecondary.emit()"
      >
        {{ correctSecondaryLabel() }}
      </button>
      <button type="button" class="kz-btn kz-btn--outline kz-btn--full kz-btn--enter" (click)="playAgain.emit()">
        Play again
      </button>
    }
    @case ('loading') {
      <button type="button" class="kz-btn kz-btn--disabled" disabled>Loading…</button>
    }
    @case ('backToGames') {
      <button type="button" class="kz-btn kz-btn--primary" (click)="backToGames.emit()">Back to games</button>
    }
    @case ('retryLoad') {
      <button type="button" class="kz-btn kz-btn--primary" (click)="retryLoad.emit()">Try again</button>
    }
  }
</div>
