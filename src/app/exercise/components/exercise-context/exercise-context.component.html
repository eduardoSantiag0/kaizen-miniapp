<div class="kz-context">
  <p class="kz-turn-line">
    @if (turnSign() !== null) {
      <kz-stone-dot [sign]="turnSign()!" />
    }
    {{ turnText() }}
  </p>

  <p class="kz-meta-line">{{ metaText() }}</p>

  @if (showProgress()) {
    <div class="kz-progress" aria-hidden="true">
      @for (node of nodes(); track $index) {
        <span class="kz-progress-node" [class]="'kz-progress-node--' + node"></span>
        @if (!$last) {
          <span class="kz-progress-line" [class.kz-progress-line--ahead]="node !== 'done'"></span>
        }
      }
      <span class="kz-step-label">{{ stepLabel() }}</span>
    </div>
  }
</div>
