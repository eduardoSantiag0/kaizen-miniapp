<div class="kz-tools">
  <button
    type="button"
    class="kz-tool-btn"
    [class.kz-tool-btn--on]="hintOn()"
    [attr.aria-pressed]="hintOn()"
    (click)="hintToggle.emit()"
  >
    Hint
  </button>

  <button type="button" class="kz-tool-btn" (click)="reset.emit()">Reset</button>

  <button
    type="button"
    class="kz-tool-btn"
    [disabled]="zoomDisabled()"
    (click)="zoomToggle.emit()"
  >
    {{ zoomedIn() ? 'Full board' : 'Zoom in' }}
  </button>
</div>
