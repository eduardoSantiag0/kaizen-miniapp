@let c = copy();

<button
  type="button"
  class="kz-game-menu-trigger"
  [class.kz-game-menu-trigger--open]="open()"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="triggerLabel()"
  (click)="toggle()"
>
  <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
    <circle cx="10" cy="4" r="1.6" />
    <circle cx="10" cy="10" r="1.6" />
    <circle cx="10" cy="16" r="1.6" />
  </svg>
</button>

@if (open()) {
  <button type="button" class="kz-game-menu-overlay" aria-label="Close menu" (click)="close()"></button>

  <div class="kz-game-menu-popover" role="menu">
    <button type="button" role="menuitem" class="kz-game-menu-item" (click)="onItemTap()">
      @if (c.icon === 'cancel') {
        <svg
          class="kz-game-menu-item-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" stroke="none" />
        </svg>
      } @else {
        <svg
          class="kz-game-menu-item-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 7h16" />
          <path d="M9.5 7V4.5h5V7" />
          <path d="M6.5 7l1 13h9l1-13" />
          <path d="M10.5 11v5.5" />
          <path d="M13.5 11v5.5" />
        </svg>
      }
      {{ c.label }}
    </button>
  </div>
}
