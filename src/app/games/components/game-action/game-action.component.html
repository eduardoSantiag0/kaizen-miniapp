@let c = copy();

<button type="button" class="kz-game-action" [attr.aria-label]="c.ariaLabel" (click)="onTap()">
  @if (c.icon === 'cancel') {
    <svg class="kz-game-action-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" stroke="none" />
    </svg>
  } @else {
    <svg class="kz-game-action-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h16" />
      <path d="M9.5 7V4.5h5V7" />
      <path d="M6.5 7l1 13h9l1-13" />
      <path d="M10.5 11v5.5" />
      <path d="M13.5 11v5.5" />
    </svg>
  }
  {{ c.label }}
</button>
