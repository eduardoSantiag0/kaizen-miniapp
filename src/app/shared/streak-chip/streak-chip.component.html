@if (!hidden()) {
  <a class="kz-streak-chip-tap" routerLink="/practice/complete" [attr.aria-label]="ariaLabel()">
    <span class="kz-streak-chip">
      <span class="kz-streak-chip-stone" aria-hidden="true"></span>
      <span class="kz-streak-chip-number">{{ days() }}</span>
      <span class="kz-streak-chip-label">day{{ days() === 1 ? '' : 's' }}</span>
      <svg class="kz-streak-chip-chevron" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
  </a>
}
